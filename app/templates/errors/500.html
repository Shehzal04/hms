{% extends "base.html" %}
{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="card card-saas p-5">
      <i class="bi bi-exclamation-triangle text-danger display-1 mb-3"></i>
      <h3 class="fw-bold text-dark">Internal Server Error (500)</h3>
      <p class="text-muted leading-relaxed mb-4">
        An unexpected error occurred while processing your database request. The transaction has been rolled back safely.
      </p>
      <div>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4 shadow-sm">
          <i class="bi bi-house-door me-1"></i> Return to Portal Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
