{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="card card-saas p-5">
      <i class="bi bi-file-earmark-x text-warning display-1 mb-3"></i>
      <h3 class="fw-bold text-dark">Page Not Found (404)</h3>
      <p class="text-muted leading-relaxed mb-4">
        The requested record, room, student profile, or report does not exist or may have been relocated.
      </p>
      <div>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4 shadow-sm">
          <i class="bi bi-house-door me-1"></i> Return to Portal Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
